    env:
      - MULTITENANT: "true"
      - DANGEROUS_DELAYED_AUTH: "false"
      - AWS_REGION: "us-east-2"
      - JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      - PORT: "9000"
      - BUFFER_SIZE: "1048576"
    secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    networks: [storage, internal]

shim:
