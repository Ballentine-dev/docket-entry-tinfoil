# Synthetic infrastructure setup only; no application workflow or private inputs.
# Based on the official Tinfoil template recorded in README.md.
cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "setup-check"
    image: "ghcr.io/tinfoilsh/tinfoil-containers-hello-world@sha256:c943b1cab16409e2e686ad71deab30364c27421852cdd6b3080df1c7a38331ed"
    env:
      - MESSAGE: "Docket Entry infrastructure setup check"

shim:
  upstream-port: 8080
  paths:
    - /*
