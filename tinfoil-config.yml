cvm-version: "0.14.7"
cpus: 2
memory: 8192

networks:
  provider:
    egress: allowlist
    allow: [openrouter.ai, docketentry.com, www.courtlistener.com]
  storage:
    egress: open
  internal:
    egress: closed

containers:
  - name: runner
    image: "ghcr.io/ballentine-dev/docket-entry-m0@sha256:299a7bbf7d826bc8bcf39bd25977db8a8b17ccc757b7d3e6939f9da5cf6f19ea"
    env:
      - PORT: "8080"
      - DOCKET_RUNNER_MODE: "m2"
      - DOCKET_M2_CONFIG: '{"environment":"development","feed_url":"https://docketentry.com/api/box/sync","issuer_token_sha256":"e953e4443c67f190383d2ff5cae2c9d33014f1d84090ad41afb884274a05c443","releases":{"EMAIL":{"brain_version":"m2-brain-v1","formatter_version":"m2-formatter-v1","model_config_version":"cfg-1","recipe_version":"m2-recipe-v1","release_id":"m2-v0.4.0","specialization_version":"m2-specialization-v1","tools_version":"m2-tools-v1"},"MAJOR_ADVANCED":{"brain_version":"m2-brain-v1","formatter_version":"m2-formatter-v1","model_config_version":"cfg-2","recipe_version":"m2-recipe-v1","release_id":"m2-v0.4.0","specialization_version":"m2-specialization-v1","tools_version":"m2-tools-v1"},"MAJOR_MAX":{"brain_version":"m2-brain-v1","extension_version":"m2-extension-v1","formatter_version":"m2-formatter-v1","model_config_version":"cfg-2","recipe_version":"m2-recipe-v1","release_id":"m2-v0.4.0","specialization_version":"m2-specialization-v1","tools_version":"m2-tools-v1"},"MAJOR_STANDARD":{"brain_version":"m2-brain-v1","formatter_version":"m2-formatter-v1","model_config_version":"cfg-2","recipe_version":"m2-recipe-v1","release_id":"m2-v0.4.0","specialization_version":"m2-specialization-v1","tools_version":"m2-tools-v1"}},"storage_bucket":"docket-entry-m1-212346651704-us-east-2","version":3,"workload_id":"m2-v0.4.0"}'
    secrets:
      - FEED_SECRET
      - PACKAGE_KEY
    networks: [provider, internal]

  - name: buckets
    image: "ghcr.io/tinfoilsh/tinfoil-buckets-sidecar@sha256:03d43dd687a5ed352f3d4956db6af706ec9dee8ca2c0fbce651ee59317b2ede5"
    env:
      - MULTITENANT: "true"
      - DANGEROUS_DELAYED_AUTH: "false"
      - AWS_REGION: "us-east-2"
      - JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      - PORT: "9000"
      - BUFFER_SIZE: "16777216"
    secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    networks: [storage, internal]

shim:
  upstream-container: runner
  upstream-port: 8080
  paths:
    - /health
    - /v1/*
    - /v2/*
