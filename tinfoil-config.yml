# Synthetic execution proof; no private instructions, credentials or customer data.
cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  provider:
    egress: allowlist
    allow:
      - openrouter.ai

containers:
  - name: runner
    image: ghcr.io/ballentine-dev/docket-entry-m0@sha256:3fcdc45f17735ae0066ddf4653ad0212459c2c98ef6bf525c0662e6b0f3ddf37
    networks:
      - provider
    env:
      - PORT: "8080"

shim:
  upstream-port: 8080
  paths:
    - /health
    - /jobs
    - /jobs/*
