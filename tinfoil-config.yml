    env:
      - PORT: "8080"
      - DOCKET_RUNNER_MODE: "m2"
      - DOCKET_M2_CONFIG: '{"customer_tokens":{"TS2nBBWzM0VJGjOXkcjJtt-YHo-dtZgd":"1a1b6c46b2789375a1149abd79fddc92695f7ca7a573a7b3d10ac6477320ee5c","miWrC05o2zWNG93e6g6y1uUDW7QCLWuI":"e1b98c0d7941fef45e8435673f09bbb044d655e605948b7ccffd3f1ab25c87db"},"issuer_token_sha256":"539ab99e0ae5088ca817bd0ea3543787e65302646e3d5acc6461f5bd687ad20e","models":{"m2-model-v1":{"max_tokens":128,"model":"meta-llama/llama-3.1-8b-instruct"},"m2-model-v2":{"max_tokens":4096,"model":"meta-llama/llama-3.1-8b-instruct"}},"releases":{"EMAIL":{"brain_version":"m2-brain-v1","formatter_version":"m2-formatter-v1","model_config_version":"m2-model-v2","recipe_version":"m2-recipe-v1","release_id":"m2-v0.2.1","specialization_version":"m2-specialization-v1","tools_version":"m2-tools-v1"}},"storage_bucket":"docket-entry-m1-212346651704-us-east-2","version":2,"workload_id":"m2-v0.2.1"}'
