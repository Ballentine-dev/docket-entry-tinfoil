# Synthetic execution proof; no private instructions, credentials or customer data.
cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  provider:
    egress: allowlist
    allow:
      - openrouter.ai

containers:
  - name: runner
    image: ghcr.io/ballentine-dev/docket-entry-m0@sha256:4befa5c95d02bfd06a4a97d115eb17a4f0d2ecf3c8bae188fceff55f5554247f
    networks:
      - provider
    env:
      - PORT: "8080"

shim:
  upstream-port: 8080
  paths:
    - /health
    - /jobs
    - /jobs/*
