# Synthetic execution proof; no private instructions, credentials or customer data.
cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  provider:
    egress: allowlist
    allow:
      - openrouter.ai

containers:
  - name: runner
    image: ghcr.io/ballentine-dev/docket-entry-m0@sha256:abbd448ef1ebc80b07d064955189348c48ce7620a0965ff73ddf9b7fce14b706
    networks:
      - provider
    env:
      - PORT: "8080"

shim:
  upstream-port: 8080
  paths:
    - /health
    - /jobs
    - /jobs/*
